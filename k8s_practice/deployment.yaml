# -----------------------------------------------------------
# Deployment: my-app
# -----------------------------------------------------------
# Deployment 負責「管理 Pod 的數量」，確保隨時有指定數量的副本在運行。
# 如果一個 Pod 掛了，Deployment 會自動建一個新的。
apiVersion: apps/v1          # Deployment 用的 API 版本
kind: Deployment             # 資源類型：部署
metadata:
  name: my-app               # Deployment 名稱
  namespace: my-practice     # 放在哪個 namespace
spec:
  replicas: 2                # 要維持幾個 Pod（副本數）
  selector:
    matchLabels:
      app: my-app            # 用 label 來找到它管理的 Pod
  template:                  # ---- 以下是 Pod 的模板 ----
    metadata:
      labels:
        app: my-app          # Pod 的標籤，要跟上面 selector 對應
    spec:
      containers:
      # ========== Container 1: server-a ==========
      - name: server-a                    # 容器名稱
        image: nginx:alpine               # 使用的 image（先用 nginx 代替）
        ports:
        - containerPort: 8080             # 容器內部監聽的 port
        # --- 修改 nginx 預設 port 為 8080，並加上 /health endpoint ---
        command: ["/bin/sh", "-c"]
        args:
        - |
          # 修改 nginx 設定：監聽 8080，/health 回傳 200
          cat > /etc/nginx/conf.d/default.conf << 'EOF'
          server {
              listen 8080;
              location / {
                  root /usr/share/nginx/html;
                  index index.html;
              }
              location /health {
                  access_log off;
                  return 200 'server-a OK\n';
                  add_header Content-Type text/plain;
              }
          }
          EOF
          nginx -g 'daemon off;'
        # livenessProbe: 容器是否「還活著」？
        # 如果連續失敗 → K8s 會殺掉這個容器並重啟整個 Pod
        livenessProbe:
          httpGet:
            path: /health                 # 健康檢查的路徑
            port: 8080                    # 健康檢查的 port
          initialDelaySeconds: 5          # Pod 啟動後等幾秒才開始檢查
          periodSeconds: 5               # 每幾秒檢查一次
          failureThreshold: 3            # 連續失敗幾次才算不健康
        # readinessProbe: 容器是否「準備好接收流量」？
        # 如果失敗 → Service 不會把流量導到這個 Pod（但不會重啟）
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 3
          failureThreshold: 2

      # ========== Container 2: server-b ==========
      - name: server-b
        image: nginx:alpine
        ports:
        - containerPort: 8081
        command: ["/bin/sh", "-c"]
        args:
        - |
          cat > /etc/nginx/conf.d/default.conf << 'EOF'
          server {
              listen 8081;
              location / {
                  root /usr/share/nginx/html;
                  index index.html;
              }
              location /health {
                  access_log off;
                  return 200 'server-b OK\n';
                  add_header Content-Type text/plain;
              }
          }
          EOF
          nginx -g 'daemon off;'
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 3
          periodSeconds: 3
          failureThreshold: 2

      # ========== Container 3: server-c ==========
      - name: server-c
        image: nginx:alpine
        ports:
        - containerPort: 8082
        command: ["/bin/sh", "-c"]
        args:
        - |
          cat > /etc/nginx/conf.d/default.conf << 'EOF'
          server {
              listen 8082;
              location / {
                  root /usr/share/nginx/html;
                  index index.html;
              }
              location /health {
                  access_log off;
                  return 200 'server-c OK\n';
                  add_header Content-Type text/plain;
              }
          }
          EOF
          nginx -g 'daemon off;'
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 3
          periodSeconds: 3
          failureThreshold: 2
